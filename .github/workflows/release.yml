# Builds the launcher for macOS, Windows and Linux and attaches them to a GitHub release.
# Runs when a version tag is pushed: bump "version" in package.json, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and package.json agree
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::The tag is $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build and upload
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
