# Builds the launcher for macOS, Windows and Linux into a draft GitHub release, then puts
# build/release-notes.md on it as its description. Publish the draft when it looks right.
# Runs when a version tag is pushed: bump "version" in package.json, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag and package.json agree
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::The tag is $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build and upload
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder only puts the notes in latest.yml (for the updater), not on the release
  # page, so they go on once all three builds are up
  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release notes on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build/release-notes.md ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file build/release-notes.md
          else
            echo "No build/release-notes.md, so the release keeps GitHub's default text"
          fi
